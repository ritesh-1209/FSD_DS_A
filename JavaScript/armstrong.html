<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=prompt("enter the number");
        let b=a;
        let s=0;
        while(a>0){
            let d=a%10;
            s+=d**3;
            a=Math.floor(a/10);
        }
        if(s==b){
            console.log("yes");
        }
        else{
            console.log("no");
        }



    </script>
</body>
</html>
