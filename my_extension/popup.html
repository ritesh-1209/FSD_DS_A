<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, system-ui, sans-serif;
        }
        body {
            width: 360px;
            min-height: 430px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8edf5;
            padding: 20px;
        }
        .container {
            width: 100%;
            padding: 24px;
            border-radius: 28px;
            background: #e8edf5;
            box-shadow:
                12px 12px 24px #c8ccd3,
                -12px -12px 24px #ffffff;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }
        .logo {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            background: #e8edf5;
            box-shadow:
                8px 8px 16px #c8ccd3,
                -8px -8px 16px #ffffff;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #2d3748;
        }
        .subtitle {
            font-size: 13px;
            color: #718096;
            margin-top: 4px;
        }
        .card {
            min-height: 170px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 22px;
            border-radius: 22px;
            background: #e8edf5;
            box-shadow:
                inset 8px 8px 16px #cfd4db,
                inset -8px -8px 16px #ffffff;
        }
        #abc {
            color: #444;
            font-size: 16px;
            line-height: 1.7;
        }
        .buttons {
            display: flex;
            gap: 14px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            border: none;
            outline: none;
            padding: 13px;
            cursor: pointer;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            color: #374151;
            background: #e8edf5;
            transition: .25s;
            box-shadow:
                6px 6px 12px #c8ccd3,
                -6px -6px 12px #ffffff;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: scale(.98);
            box-shadow:
                inset 6px 6px 12px #c8ccd3,
                inset -6px -6px 12px #ffffff;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #8a94a6;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
    <div class="header">
        <div class="logo">😂</div>
        <div>
            <h1>Random Joke</h1>
            <p class="subtitle">Brighten your day</p>
        </div>
    </div>
    <div class="card">
        <p id="abc">Loading...</p>
    </div>
    <div class="buttons">
        <button id="get">New Joke</button>
        <button id="copy">Copy</button>
    </div>
    <div class="footer">
        Created By Ritesh Dubey
    </div>
</div>

    <script src="index.js"></script>

</body>

</html>
